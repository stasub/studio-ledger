<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>スタジオ帳簿</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スタジオ帳簿">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--tx:#222;--sub:#777;--ac:#2f6f5e;--in:#2f6f5e;--out:#c4553b;--bd:#e5e2dc;--warn:#a76a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a19;--card:#232625;--tx:#eee;--sub:#aaa;--ac:#5bb49c;--in:#5bb49c;--out:#e88a72;--bd:#333;--warn:#e1ad4f}}
:root[data-theme="dark"]{--bg:#181a19;--card:#232625;--tx:#eee;--sub:#aaa;--ac:#5bb49c;--in:#5bb49c;--out:#e88a72;--bd:#333;--warn:#e1ad4f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:80px}
.w{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:14px 0;font-size:15px;font-weight:600}
.tabs button.on{color:var(--ac)}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:700}.seg button.out.on{background:var(--out);color:#fff;border-color:var(--out)}.seg button.in.on{background:var(--in);color:#fff;border-color:var(--in)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.big{font-size:24px;font-weight:700}.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:700}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:8px;font-size:14px;padding:10px}.btn.warn{background:var(--bg);color:var(--warn);border:1px solid var(--bd);margin-top:8px;font-size:14px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row small{color:var(--sub);display:block}.in-c{color:var(--in);font-weight:700}.out-c{color:var(--out);font-weight:700}.x{border:0;background:none;color:var(--sub);font-size:18px;padding:6px}.bar{height:6px;border-radius:3px;background:var(--out);margin-top:4px}.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.sum div{font-size:12px;color:var(--sub)}.sum b{display:block;font-size:16px;color:var(--tx);margin-top:2px}.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mh button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:16px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}.sc{overflow-x:auto}
#top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}#st{font-size:11px;color:var(--sub);min-height:16px}.logout{border:0;background:none;color:var(--sub);font-size:12px;padding:6px}.login{max-width:420px;margin:10vh auto 0}.login h1{font-size:24px;margin:0 0 8px}.login p{color:var(--sub);line-height:1.6}.hidden{display:none!important}.note{font-size:12px;color:var(--sub);line-height:1.6}.empty{color:var(--sub);font-size:13px}.file-label{display:block;border:1px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;color:var(--tx);margin-top:8px}.file-label input{display:none}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters>div{min-width:0}.filters .wide{grid-column:1/-1}.filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.filter-actions .btn{margin-top:0}.result-count{font-size:12px;color:var(--sub);margin:2px 0 10px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.result-head b{font-size:15px}.entry-actions{display:flex;align-items:center;gap:0}.lock-banner{border-left:4px solid var(--warn)}.lock-state{font-size:13px;line-height:1.6}.history-list{margin-top:10px;border-top:1px solid var(--bd)}.history-item{padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px;line-height:1.5}.history-item:last-child{border-bottom:0}.history-item small{display:block;color:var(--sub);margin-top:2px}.edit-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<div class="w">
  <section id="loginView" class="login hidden">
    <div class="card">
      <h1>スタジオ帳簿</h1>
      <p>ログインした本人のデータだけを読み込みます。普段はメールアドレス＋パスワードでログインします。</p>
      <label>メールアドレス</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
      <label>パスワード</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード">
      <button class="btn" id="loginBtn">ログイン</button>
      <button class="btn g" id="magicBtn">初回設定用のログインリンクをメールで送る</button>
      <div id="loginMsg" class="note" style="margin-top:10px">初回だけ、メールのリンクをSafariで開いてログインしたあと「ログイン設定」からパスワードを決めてね。</div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div id="top"><div id="st">読み込み中…</div><div><button id="passwordBtn" class="logout">ログイン設定</button><button id="logoutBtn" class="logout">ログアウト</button></div></div>
    <div id="app"></div>
  </section>
</div>
<div id="tabs" class="tabs hidden"><button data-t="add" class="on">入力</button><button data-t="list">一覧</button><button data-t="sum">集計</button><button data-t="tpl">テンプレ</button></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ★ここだけ自分のSupabaseプロジェクトの値に変更。
// publishable / anon key はブラウザ公開前提のキー。service_role key は絶対に入れない。
const SUPABASE_URL = 'https://lodtjwwbiglbecmrovjg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_I9pOeNYUqlSzZPMznQTnoA_goBLeaKq';
const configured = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_');
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;

let user = null;
let E = [], T = [];
let CI = [], CO = [], PI = [], PO = [];
let tf = null, tab = 'add', type = 'out', ym = today().slice(0,7), form = {date:today()};
let sumYear = Number(today().slice(0,4));
let listPeriod='month', listType='all', listCat='', listName='', listPay='';
let editDraft=null, yearLocks={}, lockFeatureReady=true, historyOpen=false, historyRows=[], historyYear=null;
const $ = s => document.querySelector(s);
const y = n => '¥' + Math.round(Number(n)||0).toLocaleString();
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function status(t){$('#st').textContent=t}
function uid(prefix='x'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function showLogin(message=''){
  $('#loginView').classList.remove('hidden'); $('#appView').classList.add('hidden'); $('#tabs').classList.add('hidden');
  $('#loginMsg').textContent = message;
}
function showApp(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#tabs').classList.remove('hidden');
}

async function boot(){
  if(!configured){showLogin('SupabaseのURLとPublishable Keyを設定すると使えます。'); $('#loginBtn').disabled=true; return;}
  const {data:{session}} = await supabase.auth.getSession();
  if(session?.user){await signedIn(session.user)} else showLogin();
  supabase.auth.onAuthStateChange(async (event, session)=>{
    if(session?.user && user?.id!==session.user.id) await signedIn(session.user);
    if(event==='SIGNED_OUT'){user=null;E=[];T=[];showLogin('ログアウトしました');}
  });
}

async function signedIn(u){
  user=u; showApp(); status('☁️ データを読み込み中…');
  await loadAll(); render(); status('☁️ 同期中');
}

let pendingLoginEmail = localStorage.getItem('studioLedgerLoginEmail') || '';
if(pendingLoginEmail) $('#loginEmail').value = pendingLoginEmail;

$('#loginBtn').addEventListener('click', async ()=>{
  const email=$('#loginEmail').value.trim();
  const password=$('#loginPassword').value;
  if(!email){$('#loginEmail').focus();return;}
  if(!password){$('#loginPassword').focus();return;}
  $('#loginBtn').disabled=true; $('#loginMsg').textContent='ログイン中…';
  const {error}=await supabase.auth.signInWithPassword({email,password});
  $('#loginBtn').disabled=false;
  if(error){$('#loginMsg').textContent='ログインできませんでした：'+error.message;return;}
  pendingLoginEmail=email; localStorage.setItem('studioLedgerLoginEmail', email);
  $('#loginMsg').textContent='ログインしました';
});

$('#magicBtn').addEventListener('click', async ()=>{
  const email=$('#loginEmail').value.trim(); if(!email){$('#loginEmail').focus();return;}
  $('#magicBtn').disabled=true; $('#loginMsg').textContent='送信中…';
  const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.href}});
  $('#magicBtn').disabled=false;
  if(error){$('#loginMsg').textContent='送信できませんでした：'+error.message;return;}
  pendingLoginEmail=email; localStorage.setItem('studioLedgerLoginEmail', email);
  $('#loginMsg').textContent='メールを送ったよ。届いたリンクをSafariで開いて、このサイトに戻ったら「ログイン設定」でパスワードを決めてね。';
});

$('#loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});

$('#passwordBtn').addEventListener('click', async ()=>{
  if(!user)return;
  const p1=prompt('この帳簿にログインするときの新しいパスワードを入力してね（8文字以上がおすすめ）');
  if(p1===null)return;
  if(p1.length<8){alert('8文字以上にしてね');return;}
  const p2=prompt('確認のため、もう一度同じパスワードを入力してね');
  if(p2===null)return;
  if(p1!==p2){alert('パスワードが一致してないよ');return;}
  status('🔐 パスワードを設定中…');
  const {error}=await supabase.auth.updateUser({password:p1});
  if(error){status('⚠️ パスワード設定失敗：'+error.message);return;}
  status('✅ ログイン用パスワードを設定しました');
  alert('パスワードを設定したよ。次からホーム画面のアプリで、メールアドレス＋このパスワードでログインできるよ。');
});

$('#logoutBtn').addEventListener('click',()=>supabase.auth.signOut());

async function fetchAllRows(table,columns,orderCol='id',ascending=true){
  const out=[];const page=1000;let from=0;
  while(true){
    let q=supabase.from(table).select(columns).range(from,from+page-1);
    if(orderCol){q=q.order(orderCol,{ascending});if(orderCol!=='id'&&table!=='year_locks')q=q.order('id',{ascending:true})}
    const {data,error}=await q;if(error)throw error;
    out.push(...(data||[]));if(!data||data.length<page)break;from+=page;
  }
  return out;
}
async function loadAll(){
  const [entries,templates,ss,yl]=await Promise.all([
    fetchAllRows('entries','id,type,date,name,cat,pay,amt,memo','date',false),
    fetchAllRows('templates','id,type,name,cat,amt,pay,sort_order','sort_order',true),
    supabase.from('ledger_settings').select('income_categories,expense_categories,income_accounts,expense_methods').maybeSingle(),
    supabase.from('year_locks').select('year,locked,locked_at,unlocked_at')
  ]);
  if(ss.error) throw ss.error;
  E=(entries||[]).map(x=>({...x,amt:Number(x.amt)||0}));
  T=(templates||[]).map(x=>({...x,amt:Number(x.amt)||0}));
  const s=ss.data||{}; CI=s.income_categories||[]; CO=s.expense_categories||[]; PI=s.income_accounts||[]; PO=s.expense_methods||[];
  if(yl.error){lockFeatureReady=false;yearLocks={};}
  else{lockFeatureReady=true;yearLocks=Object.fromEntries((yl.data||[]).map(x=>[String(x.year),x]));}
}

async function insertEntry(o){
  const payload={...o,user_id:user.id};
  const {error}=await supabase.from('entries').insert(payload); if(error) throw error;
}
async function updateEntry(id,o){const {error}=await supabase.from('entries').update(o).eq('id',id);if(error)throw error}
async function deleteEntry(id){const {error}=await supabase.from('entries').delete().eq('id',id);if(error)throw error}
async function setYearLockDb(year,locked){
  const now=new Date().toISOString();
  const payload=locked?{user_id:user.id,year:Number(year),locked:true,locked_at:now,unlocked_at:null}:{user_id:user.id,year:Number(year),locked:false,unlocked_at:now};
  const {data,error}=await supabase.from('year_locks').upsert(payload,{onConflict:'user_id,year'}).select('year,locked,locked_at,unlocked_at').single();
  if(error)throw error;return data;
}
async function fetchYearHistory(year){
  const {data,error}=await supabase.from('ledger_audit_log').select('id,action,entry_id,year,old_data,new_data,created_at').eq('year',Number(year)).order('created_at',{ascending:false}).limit(200);
  if(error)throw error;return data||[];
}
async function upsertTemplate(o,index){
  const payload={...o,user_id:user.id,sort_order:index};
  const {error}=await supabase.from('templates').upsert(payload,{onConflict:'user_id,id'});if(error)throw error;
}
async function deleteTemplate(id){const {error}=await supabase.from('templates').delete().eq('id',id);if(error)throw error}

function opts(a,v){return (a||[]).map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}
function optsKeep(a,v){const z=[...(a||[])];if(v&&!z.includes(v))z.unshift(v);return opts(z,v)}
function entryYear(e){return String(e?.date||'').slice(0,4)}
function isYearLocked(year){return !!yearLocks[String(year)]?.locked}
function friendlyError(e){const m=String(e?.message||e||'');return m.includes('YEAR_LOCKED:')?m.split('YEAR_LOCKED:').pop().trim():m}
function render(){
  if(!user)return;
  const a=$('#app');
  if(!CI.length&&!CO.length){
    a.innerHTML=`<div class="card"><b>最初の設定</b><p class="note">公開用コードには個人用のカテゴリ・口座名・テンプレを入れていません。付属の「private-data.json」をこの画面から1回だけ読み込むと、Supabaseへ安全に保存できます。</p><label class="file-label">初期データJSONを選ぶ<input id="importFile" type="file" accept="application/json,.json"></label></div>`;
    $('#importFile')?.addEventListener('change',importPrivateData); return;
  }
  if(tab==='add'){
    const C=type==='in'?CI:CO,P=type==='in'?PI:PO;
    a.innerHTML=`<div class="seg"><button class="out ${type==='out'?'on':''}" onclick="setType('out')">支出</button><button class="in ${type==='in'?'on':''}" onclick="setType('in')">収入</button></div>
    ${chips()}<div class="card"><label>金額（円）</label><input id="amt" type="number" inputmode="numeric" placeholder="0" class="big" value="${esc(form.amt||'')}">
    <label>内容</label><input id="name" placeholder="内容" value="${esc(form.name||'')}">
    <label>カテゴリ</label><select id="cat">${opts(C,form.cat)}</select>
    <label>${type==='in'?'入金先':'支払方法'}</label><select id="pay">${opts(P,form.pay)}</select>
    <label>日付</label><input id="date" type="date" value="${esc(form.date)}">
    <label>メモ（任意）</label><input id="memo" value="${esc(form.memo||'')}">
    <button class="btn" onclick="addEntry()">追加する</button></div>`;
  }
  if(tab==='tpl') a.innerHTML=tplView();
  if(tab==='list'){
    const L=getListFiltered(), I=L.filter(e=>e.type==='in'), O=L.filter(e=>e.type==='out');
    const cats=listType==='in'?CI:listType==='out'?CO:[...new Set([...CI,...CO])];
    const pays=listType==='in'?PI:listType==='out'?PO:[...new Set([...PI,...PO])];
    const label=listPeriod==='month'?'この月':listPeriod==='year'?'この年':'全期間';
    const listYr=listPeriod==='all'?'':ym.slice(0,4);
    const lockBanner=listYr&&isYearLocked(listYr)?`<div class="card lock-banner"><div class="lock-state">🔒 <b>${esc(listYr)}年はロック中</b><br><span class="note">この年の追加・編集・削除は停止中。解除は「集計」→年間集計からできます。</span></div></div>`:'';
    a.innerHTML=listNav()+lockBanner+(editDraft?entryEditView():'')+`<div class="card"><b>絞り込み</b><div class="filters">
      <div><label>期間</label><select onchange="setListFilter('period',this.value)"><option value="month"${listPeriod==='month'?' selected':''}>この月</option><option value="year"${listPeriod==='year'?' selected':''}>この年</option><option value="all"${listPeriod==='all'?' selected':''}>全期間</option></select></div>
      <div><label>収支</label><select onchange="setListFilter('type',this.value)"><option value="all"${listType==='all'?' selected':''}>すべて</option><option value="out"${listType==='out'?' selected':''}>支出</option><option value="in"${listType==='in'?' selected':''}>収入</option></select></div>
      <div><label>カテゴリ</label><select onchange="setListFilter('cat',this.value)"><option value="">すべて</option>${cats.map(x=>`<option value="${esc(x)}"${x===listCat?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label>支払 / 入金先</label><select onchange="setListFilter('pay',this.value)"><option value="">すべて</option>${pays.map(x=>`<option value="${esc(x)}"${x===listPay?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="wide"><label>名前</label><select onchange="setListFilter('name',this.value)"><option value="">すべて</option>${[...new Set(E.map(e=>e.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).map(x=>`<option value="${esc(x)}"${x===listName?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
    </div><button class="btn g" onclick="clearListFilters()">絞り込みをクリア</button></div>
    <div class="card"><div class="result-head"><b>${esc(label)}の絞り込み結果</b><span class="result-count">${L.length}件</span></div><div class="sum"><div>収入<b class="in-c">${y(sum(I))}</b></div><div>支出<b class="out-c">${y(sum(O))}</b></div><div>収支<b>${y(sum(I)-sum(O))}</b></div></div></div>
    <div class="card">${L.length?L.map(e=>{const locked=isYearLocked(entryYear(e));return `<div class="row"><div><b>${esc(e.name||e.cat)}</b><small>${listPeriod==='month'?String(e.date).slice(5):esc(e.date)} ・ ${esc(e.cat)} ・ ${esc(e.pay)}${e.memo?' ・ '+esc(e.memo):''}</small></div><div style="text-align:right"><span class="${e.type==='in'?'in-c':'out-c'}">${e.type==='in'?'+':'−'}${y(e.amt)}</span><div class="entry-actions">${locked?'<span class="pill">🔒 ロック中</span>':`<button class="x" onclick="startEdit('${esc(e.id)}')" aria-label="編集">✏️</button><button class="x" onclick="delEntry('${esc(e.id)}')" aria-label="削除">✕</button>`}</div></div></div>`}).join(''):'<small class="empty">条件に合うデータはありません</small>'}</div>
    <button class="btn g" onclick="csvFiltered()">絞り込み結果をCSVで書き出す</button><button class="btn g" onclick="csv()">全期間をCSVで書き出す</button><button class="btn g" onclick="fullBackup()">フルバックアップJSONを保存</button><p class="note" style="margin:8px 2px 0">CSVは確定申告前の確認用にも便利。フルバックアップは帳簿・テンプレ・カテゴリ・口座設定に加えて、年ロックと変更履歴もまとめて保存します。</p>`;
  }
  if(tab==='sum'){
    const L=E.filter(e=>String(e.date).startsWith(ym)),I=L.filter(e=>e.type==='in'),O=L.filter(e=>e.type==='out');
    const si=sum(I),so=sum(O),by={};O.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);const rows=Object.entries(by).sort((p,q)=>q[1]-p[1]);

    const yr=String(sumYear);
    const Y=E.filter(e=>String(e.date).startsWith(yr+'-'));
    const YI=Y.filter(e=>e.type==='in'),YO=Y.filter(e=>e.type==='out');
    const ysi=sum(YI), yso=sum(YO);
    const outBy={}, inBy={};
    YO.forEach(e=>outBy[e.cat]=(outBy[e.cat]||0)+(Number(e.amt)||0));

function yearLockCard(year){

async function toggleYearLock(year){

async function toggleHistory(year){

function fmtHistTime(v){try{return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return String(v||'')}}
function histVal(k,v){if(k==='amt')return y(v);if(k==='type')return v==='in'?'収入':'支出';return String(v??'')||'（空欄）'}
function historySummary(h){
  if(h.action==='lock_year')return '🔒 年をロック';
  if(h.action==='unlock_year')return '🔓 年のロックを解除';
  const o=h.old_data||{},n=h.new_data||{};
  if(h.action==='insert')return `➕ 追加：${esc(n.name||n.cat||'明細')} ${y(n.amt)}`;
  if(h.action==='delete')return `🗑️ 削除：${esc(o.name||o.cat||'明細')} ${y(o.amt)}`;
  if(h.action==='update'){
    const labels={date:'日付',type:'収支',name:'内容',cat:'カテゴリ',pay:'支払/入金先',amt:'金額',memo:'メモ'};
    const changes=Object.keys(labels).filter(k=>String(o[k]??'')!==String(n[k]??'')).map(k=>`${labels[k]}：${esc(histVal(k,o[k]))} → ${esc(histVal(k,n[k]))}`);
    return `✏️ 編集：${esc(n.name||o.name||n.cat||o.cat||'明細')}<small>${changes.join(' / ')||'内容変更'}</small>`;
  }
  return esc(h.action||'変更');
}
